<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lí Công Việc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header style="background-color:#6c5ce7; padding: 20px; text-align: center;">
        <h1 style="color:#ffffff;">Hệ Thống Quản Lí Công Việc</h1>
    </header>

    <div class="container py-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="text-center text-primary mb-4">Thêm / Cập Nhật Công Việc</h3>
                <form>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="tenCongViec" class="form-label">Tên công việc:</label>
                            <input type="text" class="form-control is-invalid" id="tenCongViec">
                            <div class="invalid-feedback">Không được để trống</div>
                        </div>

                        <div class="col-md-6">
                            <label for="hanChot" class="form-label">Hạn chót:</label>
                            <input type="date"class="form-control is-invalid" id="hanChot">
                            <div class="text-danger">Phải chọn ngày</div>
                        </div>
                
                        <div class="col-md-6">
                            <label for="nguoiPhuTrach" class="form-label">Người phụ trách:</label>
                            <input type="text" class="form-control is-invalid" id="nguoiPhuTrach">
                            <div class="invalid-feedback">Không được để trống</div>
                        </div>

                        <div class="col-md-6">
                            <label for="trangThai" class="form-label">Trạng thái:</label>
                            <select class="form-select is-invalid" id="trangThai">
                                <option value="">-- Chọn trạng thái --</option>
                                <option value="1">Đang làm</option>
                                <option value="2">Hoàn thành</option>
                                <option value="3">Trễ hạn</option>
                            </select>
                            <div class="invalid-feedback" onclick="">Vui lòng chọn trạng thái</div>
                        </div>
                    </div>
                
                    <div class="mt-4" style="width: 400px;">
                        <button type="submit" class="btn btn-success w-100">Thêm công việc</button>
                    </div>
                    <br>
                    <div class="search">
                        <input style="width: 1000px;" type="text" id="searchInput" placeholder="Tìm kiếm theo tên công việc..." onkeydown="handleSearch(event)">
                      </div>
                </form>   
                    <table class="table mt-5">
                        <thead style="background-color: #6c5ce7; color: white;">
                            <tr>
                                <th>Công việc</th>
                                <th>Hạn chót</th>
                                <th>Phụ trách</th>
                                <th>Trạng thái</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="taskList">
                        </tbody>
                    </table>
             
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./main.js"></script>
</body>
</html>
